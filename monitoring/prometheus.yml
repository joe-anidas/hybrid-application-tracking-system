global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "ats-prometheus"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ATS Backend Metrics
  - job_name: "ats-backend"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 5s

  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Loki
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
